<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星梦素材图书馆</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.7 'Microsoft YaHei',sans-serif;color:#294839;background:#f8f7ef}header,main{max-width:1120px;margin:auto;padding:25px 20px}header{border-bottom:1px solid #dee7d8;display:flex;justify-content:space-between}header b{font-size:20px}header span{color:#83977e;font-size:12px}.hero{padding:52px 0 30px}.tag{font-size:10px;letter-spacing:2px;color:#a08b61}h1{font:700 clamp(31px,5vw,52px)/1.4 Georgia,'Songti SC',serif;margin:15px 0}.hero p{color:#718672}form{display:flex;gap:10px;margin:25px 0 10px}input{flex:1;min-width:0;padding:16px;border:1px solid #cfdac7;border-radius:12px;font:inherit;background:#fffefa}button{cursor:pointer;border:0;border-radius:10px;background:#315f49;color:white;padding:12px 22px;font:inherit}button:hover{background:#244c39}button:focus-visible,input:focus-visible{outline:3px solid #c19146;outline-offset:3px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font-size:12px;padding:6px 12px;background:#e8eee2;color:#57745c}.status{color:#72866e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #dfe7d8;border-radius:15px;overflow:hidden;background:#fffefa}.card img{width:100%;height:160px;object-fit:cover;display:block}.card>div{padding:17px}.card h3{margin:6px 0;font:700 19px Georgia,'Songti SC',serif}.card p{font-size:12px;color:#748574}.score{font-size:10px;color:#9a8a63}audio{width:100%;height:35px}h2{margin-top:45px;font:700 25px Georgia,'Songti SC',serif}.suggestion{background:#eaf0e4;border-radius:15px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.empty{padding:22px;color:#8b9987;background:#f1f3eb;border-radius:12px}footer{padding:30px 0;color:#899785;font-size:11px}@media(max-width:700px){header span{display:none}.hero{padding:30px 0 10px}.grid{grid-template-columns:1fr}form{display:flex}button{padding:10px 14px}.card img{height:190px}}
</style></head><body><header><b>✦ 星梦素材图书馆</b><span>IDEAS FOR LITTLE DREAMERS</span></header><main><section class="hero"><div class="tag">A LITTLE STORY STARTS HERE</div><h1>给一个想法，<br>找到一整个故事世界。</h1><p>输入一句故事创意，寻找有关的故事模板、画面和声音。</p><form id="form"><input id="query" maxlength="200" aria-label="故事创意" placeholder="例如：一只恐龙去太空冒险" required><button>寻找素材 →</button></form><div class="chips"><button type="button" data-q="小狐狸在森林寻找风铃">森林风铃</button><button type="button" data-q="机器人恐龙探索太空星球">星际恐龙</button><button type="button" data-q="保护海洋珊瑚和海龟">守护海洋</button></div></section><p class="status" id="status" role="status">试试输入一个想法，或点击上方灵感。</p><div id="results"></div><footer>素材在本地检索 · 图片基于描述匹配 · 不上传搜索内容</footer></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#query'),root=document.querySelector('#results'),status=document.querySelector('#status');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;form.requestSubmit()});function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}form.onsubmit=async(e)=>{e.preventDefault();root.replaceChildren();status.textContent='正在寻找素材…';try{const response=await fetch('/api/search?q='+encodeURIComponent(input.value));const data=await response.json();if(!response.ok)throw new Error(data.error);let count=0;for(const [key,label] of [['template','故事模板'],['image','画面素材'],['sound','声音素材']]){root.append(el('h2',label));const grid=el('div');grid.className='grid';for(const r of data.results[key]){count++;const card=el('article');card.className='card';if(key==='image'){const img=el('img');img.src='/'+r.path;img.alt=r.title;card.append(img)}const inner=el('div');const label=el('span',`匹配度 ${Math.round(r.score*100)}%`);label.className='score';inner.append(label,el('h3',r.title),el('p',r.description));if(key==='image')inner.append(el('p',r.origin));if(key==='sound'){const audio=el('audio');audio.controls=true;audio.preload='none';audio.src='/'+r.path;inner.append(audio)}card.append(inner);grid.append(card)}if(!data.results[key].length){const empty=el('div','没有找到匹配素材，试试更具体的主题词。');empty.className='empty';grid.append(empty)}root.append(grid)}root.append(el('h2','故事创作建议'));const suggestion=el('pre',JSON.stringify(data.suggestion,null,2));suggestion.className='suggestion';root.append(suggestion);status.textContent=count?`为你找到 ${count} 条灵感。`:'暂时没有找到匹配素材。'}catch(error){status.textContent='检索失败：'+error.message}};
</script></body></html>
